  <!-- Diya Flame -->
  <path d="M256 120 Q306 210 286 280 Q256 310 226 280 Q206 210 256 120 Z" fill="url(#flame)" />
  <!-- Flame Core -->
  <path d="M256 170 Q280 230 270 270 Q256 288 242 270 Q232 230 256 170 Z" fill="#ffffff" opacity="0.8" />

