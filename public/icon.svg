  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4" />
  
  <!-- Diya Base -->
  <path d="M128 320 Q256 420 384 320 Q320 370 256 370 Q192 370 128 320 Z" fill="url(#gold)" />
  <ellipse cx="256" cy="320" rx="128" ry="24" fill="#a16207" />
