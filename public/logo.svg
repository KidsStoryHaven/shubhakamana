<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Crimson Red Typography Gradient -->
    <linearGradient id="logoCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Diya Clay Gradient -->
    <linearGradient id="logoDiya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="logoFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Sun Halo Radial Glow -->
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Gold Accent Line -->
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. TOP ILLUMINATED DIYA & SUNBURST HALO   -->
  <!-- ========================================== -->
  <g transform="translate(600, 160)" filter="url(#glowShadow)">
    <!-- Sun Halo Circle -->
    <circle cx="0" cy="-20" r="110" fill="url(#sunHalo)"/>
    <circle cx="0" cy="-20" r="112" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

    <!-- Radiant Sun Rays -->
    <g fill="#f59e0b" opacity="0.95">
      <path d="M 0 -140 L 4 -105 L -4 -105 Z"/>
      <path d="M -45 -132 L -32 -100 L -40 -98 Z"/>
      <path d="M 45 -132 L 32 -100 L 40 -98 Z"/>
      <path d="M -85 -110 L -62 -82 L -70 -78 Z"/>
      <path d="M 85 -110 L 62 -82 L 70 -78 Z"/>
      <path d="M -118 -75 L -88 -54 L -94 -48 Z"/>
      <path d="M 118 -75 L 88 -54 L 94 -48 Z"/>
      <path d="M -138 -30 L -102 -20 L -104 -12 Z"/>
      <path d="M 138 -30 L 102 -20 L 104 -12 Z"/>
    </g>

    <!-- Clay Diya Bowl -->
    <path d="M -100 0 Q 0 100 100 0 Q 55 65 0 72 Q -55 65 -100 0 Z" fill="url(#logoDiya)"/>
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#7f1d1d"/>
    <ellipse cx="0" cy="-3" rx="88" ry="16" fill="#991b1b"/>

    <!-- Golden Lotus Petals on Diya -->
    <g fill="#fef08a">
      <path d="M 0 20 Q -15 50 0 65 Q 15 50 0 20 Z"/>
      <path d="M -38 18 Q -48 42 -30 56 Q -28 36 -38 18 Z"/>
      <path d="M 38 18 Q 48 42 30 56 Q 28 36 38 18 Z"/>
      <!-- Decorative Dots -->
      <circle cx="-60" cy="18" r="3"/>
      <circle cx="-75" cy="12" r="2.5"/>
      <circle cx="60" cy="18" r="3"/>
      <circle cx="75" cy="12" r="2.5"/>
    </g>

    <!-- Diya Flame (Jyoti) -->
    <path d="M 0 -130 Q 38 -60 28 -8 Q 0 16 -28 -8 Q -38 -60 0 -130 Z" fill="url(#logoFlame)"/>
    <path d="M 0 -85 Q 18 -40 12 -5 Q 0 10 -12 -5 Q -18 -40 0 -85 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. LEFT FLORAL & MANGO LEAF ACCENTS        -->
  <!-- ========================================== -->
  <g transform="translate(100, 260)">
    <!-- Deep Green Mango Leaves -->
    <path d="M 150 40 Q 60 -100 -40 -60 Q -10 10 120 70 Z" fill="url(#leafGreen)"/>
    <path d="M 80 50 Q -30 -30 -70 40 Q -10 90 70 80 Z" fill="#15803d"/>
    <!-- Orange & Gold Marigold Petals -->
    <ellipse cx="-45" cy="-20" rx="18" ry="10" transform="rotate(-30, -45, -20)" fill="#ea580c"/>
    <ellipse cx="-20" cy="-45" rx="16" ry="9" transform="rotate(35, -20, -45)" fill="#f59e0b"/>
    <ellipse cx="-55" cy="15" rx="16" ry="9" transform="rotate(-65, -55, 15)" fill="#f59e0b"/>
    <ellipse cx="-35" cy="45" rx="15" ry="8" transform="rotate(-15, -35, 45)" fill="#ea580c"/>
    <circle cx="-65" cy="-5" r="7" fill="#fbbf24"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. RIGHT FLORAL & MANGO LEAF ACCENTS       -->
  <!-- ========================================== -->
  <g transform="translate(1100, 260)">
    <!-- Deep Green Mango Leaves -->
    <path d="M -150 40 Q -60 -100 40 -60 Q 10 10 -120 70 Z" fill="url(#leafGreen)"/>
    <path d="M -80 50 Q 30 -30 70 40 Q 10 90 -70 80 Z" fill="#15803d"/>
    <!-- Orange & Gold Marigold Petals -->
    <ellipse cx="45" cy="-20" rx="18" ry="10" transform="rotate(30, 45, -20)" fill="#ea580c"/>
    <ellipse cx="20" cy="-45" rx="16" ry="9" transform="rotate(-35, 20, -45)" fill="#f59e0b"/>
    <ellipse cx="55" cy="15" rx="16" ry="9" transform="rotate(65, 55, 15)" fill="#f59e0b"/>
    <ellipse cx="35" cy="45" rx="15" ry="8" transform="rotate(15, 35, 45)" fill="#ea580c"/>
    <circle cx="65" cy="-5" r="7" fill="#fbbf24"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. MAIN BRAND TYPOGRAPHY "Shubhakamna"      -->
  <!-- ========================================== -->
  <text x="600" y="325" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Noto Serif', serif" 
        font-size="132" 
        font-weight="900" 
        fill="url(#logoCrimson)" 
        text-anchor="middle" 
        letter-spacing="-1">
    Shubhakamna
  </text>

  <!-- ========================================== -->
  <!-- 5. SUBTITLE "— FESTIVAL WISHES —"          -->
  <!-- ========================================== -->
  <!-- Left Green Rule -->
  <line x1="220" y1="365" x2="330" y2="365" stroke="#166534" stroke-width="4" stroke-linecap="round"/>
  
  <text x="600" y="378" 
        font-family="'Montserrat', 'Cinzel', 'Georgia', sans-serif" 
        font-size="44" 
        font-weight="800" 
        fill="#166534" 
        text-anchor="middle" 
        letter-spacing="12">
    FESTIVAL WISHES
  </text>

  <!-- Right Green Rule -->
  <line x1="870" y1="365" x2="980" y2="365" stroke="#166534" stroke-width="4" stroke-linecap="round"/>

  <!-- Golden Flourish & Central Red Heart -->
  <g transform="translate(600, 420)">
    <!-- Left Gold Swirl -->
    <path d="M -250 -10 Q -120 -15 -25 0 Q -120 5 -250 -10 Z" fill="#f59e0b"/>
    <!-- Central Red Heart -->
    <path d="M 0 0 C 0 -6 -8 -15 -17 -15 C -25 -15 -30 -9 -30 -2 C -30 7 -12 21 0 30 C 12 21 30 7 30 -2 C 30 -9 25 -15 17 -15 C 8 -15 0 -6 0 0 Z" fill="#dc2626"/>
    <!-- Right Gold Swirl -->
    <path d="M 250 -10 Q 120 -15 25 0 Q 120 5 250 -10 Z" fill="#f59e0b"/>
    <!-- Golden Accent Dots -->
    <circle cx="-50" cy="8" r="4" fill="#f59e0b"/>
    <circle cx="50" cy="8" r="4" fill="#f59e0b"/>
  </g>
</svg>
